# ZOLA STYLISH MANAGEMENT SYSTEM — Nginx for the Docker frontend container.
# Serves the web application and forwards /api and /uploads to the backend.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 10m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Security headers (inherited by every location below that sets no add_header).
  # HSTS belongs on the HTTPS proxy in front of this container (docs/DEPLOYMENT.md).
  include /etc/nginx/snippets/security-headers.conf;

  # Never serve dot-files (.env, .git) even if one ends up in the web root.
  location ~ /\. {
    deny all;
    return 404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  location /uploads/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
  }

  # Fingerprinted build assets can be cached for a year.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Single-page application: unknown paths load index.html. Never stored, so the
  # browser cannot show a signed-in screen from its cache after signing out.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri /index.html;
  }
}
