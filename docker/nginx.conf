# ZOLA STYLISH MANAGEMENT SYSTEM — Nginx for the Docker frontend container.
# Serves the web application and forwards /api and /uploads to the backend.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 10m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Security headers (inherited by every location below that sets no add_header).
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "no-referrer" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  location /uploads/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
  }

  # Fingerprinted build assets can be cached for a year.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Single-page application: unknown paths load index.html (never cached).
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
