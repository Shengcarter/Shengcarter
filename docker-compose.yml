# ZOLA STYLISH MANAGEMENT SYSTEM — Docker deployment
#
#   1. cp .env.example .env    (then set the passwords and secrets)
#   2. docker compose up -d --build
#   3. open http://localhost (or http://<server-ip> from other salon computers)
#
# Data lives in named volumes (mysql-data, uploads, backups) and survives
# container rebuilds and restarts.
name: zola-stylish

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASE_NAME:-zola_stylish}
      MYSQL_USER: ${DATABASE_USER:-zola}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5000
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      # Nginx in the frontend container serves the web app and forwards /api.
      SERVE_FRONTEND: "false"
      # Number of proxies in front of the API: 1 = the frontend container.
      # Use 2 when another HTTPS proxy (e.g. Nginx on the host) forwards here.
      TRUST_PROXY: "${DOCKER_PROXY_HOPS:-1}"
      UPLOAD_DIR: /app/backend/storage/uploads
      BACKUP_DIR: /app/backend/storage/backups
      LOG_FILE: ""
    volumes:
      - uploads:/app/backend/storage/uploads
      - backups:/app/backend/storage/backups
    depends_on:
      mysql:
        condition: service_healthy

  # Optional virus scanning of uploads (ClamAV, about 1–2 GB of memory).
  # Start with:  docker compose --profile antivirus up -d
  # and set CLAMAV_HOST=clamav (and MALWARE_SCAN_REQUIRED=true) in .env.
  clamav:
    image: clamav/clamav:stable
    profiles: ["antivirus"]
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  uploads:
  backups:
  clamav-db:
