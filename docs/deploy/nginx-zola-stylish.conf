# ZOLA STYLISH MANAGEMENT SYSTEM — Nginx site for a Linux VPS (see docs/DEPLOYMENT.md).
#
#   sudo cp docs/deploy/nginx-zola-stylish.conf /etc/nginx/sites-available/zola-stylish
#   (replace salon.example.com below with your domain)
#   sudo ln -s /etc/nginx/sites-available/zola-stylish /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d salon.example.com --redirect     # adds HTTPS
#
# The Node.js server (HOST=127.0.0.1, PORT=5000, SERVE_FRONTEND=true,
# TRUST_PROXY=true) serves the API and the web application with its own
# security headers; Nginx adds TLS and compression. For Docker behind this
# proxy use proxy_pass http://127.0.0.1:8080 (HTTP_PORT=127.0.0.1:8080).

upstream zola_stylish {
  server 127.0.0.1:5000;
  keepalive 16;
}

server {
  listen 80;
  listen [::]:80;            # remove this line if the server has no IPv6
  server_name salon.example.com;

  server_tokens off;
  client_max_body_size 10m;

  gzip on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Never expose dot-files (.env, .git) even if the proxy target changes.
  location ~ /\. {
    deny all;
    return 404;
  }

  location / {
    proxy_pass http://zola_stylish;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Large report exports (PDF/Excel) can take a while.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
}
